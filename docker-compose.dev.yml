services:
  admin:
    image: node:24.21.0-alpine3.23
    working_dir: /app
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_ENV: ${VITE_API_ENV:-local}
      VITE_API_URL: ${VITE_API_URL:-}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${ADMIN_DEV_HOST_PORT:-5173}:5173"
    volumes:
      - ./:/app
      - panel_node_modules:/app/node_modules

volumes:
  panel_node_modules:
